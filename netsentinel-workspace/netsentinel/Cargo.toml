[workspace]
resolver = "2"
members = [
    "crates/netsentinel-proto",
    "crates/netsentinel-discover",
    "crates/netsentinel-capture",
    "crates/netsentinel-scan",
    "crates/netsentinel-intercept",
    "crates/netsentinel-gtk",
    "crates/netsentinel-capture-ebpf",
    "crates/netsentinel-capture-common",
]
default-members = [
    "crates/netsentinel-proto",
    "crates/netsentinel-discover",
    "crates/netsentinel-capture",
    "crates/netsentinel-scan",
    "crates/netsentinel-intercept",
    "crates/netsentinel-gtk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["NetSentinel contributors"]
repository = "https://example.invalid/netsentinel"

[workspace.dependencies]
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"

netsentinel-proto = { path = "crates/netsentinel-proto" }

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
incremental = false
overflow-checks = false

[profile.dev]
panic = "abort"

