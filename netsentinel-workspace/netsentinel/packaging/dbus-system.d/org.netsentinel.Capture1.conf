<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.netsentinel.Capture1"/>
    <allow send_destination="org.netsentinel.Capture1"/>
  </policy>

  <!-- Le démon systemd s'exécute avec ce compte dédié, pas avec root. -->
  <policy user="netsentinel-capture">
    <allow own="org.netsentinel.Capture1"/>
  </policy>

  <policy at_console="true">
    <allow send_destination="org.netsentinel.Capture1"/>
    <allow receive_sender="org.netsentinel.Capture1"/>
  </policy>

  <policy context="default">
    <deny own="org.netsentinel.Capture1"/>
    <allow send_destination="org.netsentinel.Capture1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <deny send_destination="org.netsentinel.Capture1"
          send_interface="org.freedesktop.DBus.Properties"
          send_member="UpdateActivationEnvironment"/>
  </policy>
</busconfig>
