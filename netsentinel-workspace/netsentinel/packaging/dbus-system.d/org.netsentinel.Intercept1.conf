<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- SEULEMENT root peut prendre le nom org.netsentinel.Intercept1 (Moindre privilège + RE-01) -->
  <policy user="root">
    <allow own="org.netsentinel.Intercept1"/>
    <allow send_destination="org.netsentinel.Intercept1"/>
  </policy>

  <!-- Utilisateur en session console : envoi autorisé MAIS Polkit fera gate auth_admin (pas d'anonyme) -->
  <policy at_console="true">
    <allow send_destination="org.netsentinel.Intercept1"/>
    <allow receive_sender="org.netsentinel.Intercept1"/>
  </policy>

  <policy context="default">
    <deny own="org.netsentinel.Intercept1"/>
    <allow send_destination="org.netsentinel.Intercept1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <deny send_destination="org.netsentinel.Intercept1"
          send_interface="org.freedesktop.DBus.Properties"
          send_member="UpdateActivationEnvironment"/>
  </policy>
</busconfig>
