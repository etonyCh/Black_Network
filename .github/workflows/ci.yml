name: NetSentinel CI — Pure Rust Monorepo Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AYA_BUILD_SKIP: "1"

jobs:

  # =========================================================================
  # ÉTAPE 1 — Rust Format & Clippy Linter
  # =========================================================================
  lint:
    name: "1 — Rust Format & Clippy Check"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install APT dependencies (GTK4 & Libadwaita dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libglib2.0-dev libpango1.0-dev libcairo2-dev libssl-dev pkg-config

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo fmt check
        working-directory: netsentinel-workspace/netsentinel
        run: cargo fmt --check

      - name: Cargo clippy check
        working-directory: netsentinel-workspace/netsentinel
        run: cargo clippy --workspace --exclude netsentinel-capture-ebpf -- -D warnings

  # =========================================================================
  # ÉTAPE 2 — Tests unitaires Rust workspace
  # =========================================================================
  unit-tests:
    name: "2 — Rust Unit Tests"
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install APT dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libglib2.0-dev libpango1.0-dev libcairo2-dev libssl-dev pkg-config

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test workspace
        working-directory: netsentinel-workspace/netsentinel
        run: cargo test --workspace --exclude netsentinel-capture-ebpf

  # =========================================================================
  # ÉTAPE 3 — Cargo Audit (SAST & CVE dependencies check)
  # =========================================================================
  cargo-audit:
    name: "3 — Security Audit (cargo-audit)"
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit scan
        working-directory: netsentinel-workspace/netsentinel
        run: cargo audit

  # =========================================================================
  # ÉTAPE 4 — Détection de secrets dans l'historique git
  # =========================================================================
  secret-scan:
    name: "4 — Secret Scan (gitleaks)"
    runs-on: ubuntu-24.04
    needs: cargo-audit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          wget -qO - https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks scan
        run: gitleaks detect --source . --verbose --redact

  # =========================================================================
  # ÉTAPE 5 — Build paquet .deb (Rust workspace release)
  # =========================================================================
  build:
    name: "5 — Build (.deb Rust workspace)"
    runs-on: ubuntu-24.04
    needs: secret-scan
    outputs:
      deb-artifact: ${{ steps.upload-deb.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install System Build Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl ca-certificates libgtk-4-dev libadwaita-1-dev libglib2.0-dev libpango1.0-dev libcairo2-dev libssl-dev pkg-config clang llvm dbus polkitd apparmor libcap2-bin systemd debhelper-compat dpkg-dev

      - name: Install Rust stable & nightly
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install nightly-x86_64-unknown-linux-gnu --profile minimal --component rust-src,llvm-tools-preview
          rustup default stable

      - name: Install bpf-linker
        run: cargo install bpf-linker --locked --no-track

      - name: Cargo build release bins
        working-directory: netsentinel-workspace/netsentinel
        env:
          AYA_BUILD_SKIP: ""
        run: cargo build --workspace --profile release --bins --exclude netsentinel-capture-ebpf

      - name: Assemble .deb staging dir
        working-directory: netsentinel-workspace/netsentinel
        run: |
          set -euo pipefail
          ARCH="$(dpkg-architecture -qDEB_BUILD_ARCH)"
          STAGING="$(pwd)/debian/netsentinel"
          TARGET_PROFILE="release"
          INSTALL_ROOT="/usr"
          LIBEXEC="/usr/libexec/netsentinel"
          SYSTEMD_UNITS="/lib/systemd/system"
          DBUS_CONF="/usr/share/dbus-1/system.d"
          APPARMOR_DIR="/etc/apparmor.d"
          POLKIT_ACTIONS="/usr/share/polkit-1/actions"
          GLIB_SCHEMAS="/usr/share/glib-2.0/schemas"
          ICONS="/usr/share/icons/hicolor/scalable/apps"
          DESKTOP_DIR="/usr/share/applications"
          DATA_DIR="/usr/share/netsentinel/data"

          install -d -m 0755 "$STAGING/DEBIAN"
          install -d -m 0755 "$STAGING/$LIBEXEC"
          install -d -m 0755 "$STAGING/$INSTALL_ROOT/bin"
          install -d -m 0755 "$STAGING/$DESKTOP_DIR"
          install -d -m 0755 "$STAGING/$ICONS"
          install -d -m 0755 "$STAGING/$DBUS_CONF"
          install -d -m 0755 "$STAGING/$GLIB_SCHEMAS"
          install -d -m 0755 "$STAGING/$POLKIT_ACTIONS"
          install -d -m 0755 "$STAGING/$APPARMOR_DIR"
          install -d -m 0755 "$STAGING/$SYSTEMD_UNITS"
          install -d -m 0755 "$STAGING/$DATA_DIR"

          install -m 0755 "target/$TARGET_PROFILE/netsentinel-discoverd"  "$STAGING/$LIBEXEC/"
          install -m 0755 "target/$TARGET_PROFILE/netsentinel-scand"      "$STAGING/$LIBEXEC/"
          install -m 0755 "target/$TARGET_PROFILE/netsentinel-captured"   "$STAGING/$LIBEXEC/"
          install -m 0755 "target/$TARGET_PROFILE/netsentinel-interceptd" "$STAGING/$LIBEXEC/"
          install -m 0755 "target/$TARGET_PROFILE/netsentinel"            "$STAGING/$INSTALL_ROOT/bin/netsentinel"

          install -m 0644 packaging/dbus-system.d/org.netsentinel.Discover1.conf "$STAGING/$DBUS_CONF/"
          install -m 0644 packaging/dbus-system.d/org.netsentinel.Capture1.conf  "$STAGING/$DBUS_CONF/"
          install -m 0644 packaging/dbus-system.d/org.netsentinel.Scan1.conf     "$STAGING/$DBUS_CONF/"
          install -m 0644 packaging/dbus-system.d/org.netsentinel.Intercept1.conf "$STAGING/$DBUS_CONF/"

          install -m 0644 packaging/apparmor/usr.libexec.netsentinel-discoverd  "$STAGING/$APPARMOR_DIR/"
          install -m 0644 packaging/apparmor/usr.libexec.netsentinel-scand      "$STAGING/$APPARMOR_DIR/"
          install -m 0644 packaging/apparmor/usr.libexec.netsentinel-captured   "$STAGING/$APPARMOR_DIR/"
          install -m 0644 packaging/apparmor/usr.libexec.netsentinel-interceptd "$STAGING/$APPARMOR_DIR/"

          install -m 0644 packaging/systemd/netsentinel-discoverd.service  "$STAGING/$SYSTEMD_UNITS/"
          install -m 0644 packaging/systemd/netsentinel-scand.service      "$STAGING/$SYSTEMD_UNITS/"
          install -m 0644 packaging/systemd/netsentinel-captured.service   "$STAGING/$SYSTEMD_UNITS/"
          install -m 0644 packaging/systemd/netsentinel-interceptd.service "$STAGING/$SYSTEMD_UNITS/"

          CONTROL_FILE="$STAGING/DEBIAN/control"
          : > "$CONTROL_FILE"
          echo "Package: netsentinel" >> "$CONTROL_FILE"
          echo "Version: 0.1.0" >> "$CONTROL_FILE"
          echo "Section: utils" >> "$CONTROL_FILE"
          echo "Priority: optional" >> "$CONTROL_FILE"
          echo "Architecture: ${ARCH}" >> "$CONTROL_FILE"
          echo "Maintainer: NetSentinel Team <security@netsentinel.invalid>" >> "$CONTROL_FILE"
          echo "Homepage: https://netsentinel.invalid" >> "$CONTROL_FILE"
          echo "Depends: libgtk-4-1, libadwaita-1-0, libglib2.0-0, libpango-1.0-0, libcairo2, libgdk-pixbuf-2.0-0, libssl3, dbus-system-bus, polkitd, apparmor, systemd, libcap2-bin" >> "$CONTROL_FILE"
          echo "Description: Pure Rust GNOME GTK4 network audit + eBPF security suite" >> "$CONTROL_FILE"
          chmod 0644 "$CONTROL_FILE"

          DEB_FILENAME="${GITHUB_WORKSPACE}/netsentinel_0.1.0_${ARCH}.deb"
          dpkg-deb --build --root-owner-group "$STAGING" "$DEB_FILENAME"
          echo "DEB_PATH=$DEB_FILENAME" >> "$GITHUB_ENV"

      - id: upload-deb
        name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: netsentinel-deb-package
          path: ${{ env.DEB_PATH }}

  # =========================================================================
  # ÉTAPE 6 — SBOM (CycloneDX JSON via Syft)
  # =========================================================================
  sbom:
    name: "6 — SBOM (Syft → CycloneDX)"
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate CycloneDX SBOM
        run: syft scan --output cyclonedx-json=netsentinel-sbom.cdx.json dir:${{ github.workspace }}/netsentinel-workspace/netsentinel

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: netsentinel-sbom
          path: netsentinel-sbom.cdx.json

  # =========================================================================
  # ÉTAPE 7 — Signature des artefacts (cosign)
  # =========================================================================
  sign:
    name: "7 — Sign Artifacts (cosign)"
    runs-on: ubuntu-24.04
    needs: sbom
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: netsentinel-deb-package

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: netsentinel-sbom

      - name: Install cosign
        run: |
          curl -sSfL https://github.com/sigstore/cosign/releases/download/v2.2.4/cosign-linux-amd64 > /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

      - name: Sign .deb with keyless cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -f netsentinel_0.1.0_*.deb ]; then
            DEB="$(ls netsentinel_0.1.0_*.deb | head -1)"
            cosign sign-blob --yes "$DEB" > "$DEB.sig" || true
          fi
          if [ -f netsentinel-sbom.cdx.json ]; then
            cosign sign-blob --yes netsentinel-sbom.cdx.json > netsentinel-sbom.cdx.json.sig || true
          fi
